name: Build and Deploy Sổ Tự Học Vue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify repository root files
        shell: bash
        run: |
          set -euo pipefail
          required=(.nvmrc package.json package-lock.json tsconfig.json tsconfig.app.json tsconfig.node.json vite.config.ts index.html)
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required root file: $file. Re-upload the complete ZIP contents to the repository root."
              exit 1
            fi
          done
          echo "Repository root files verified."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure runtime config is absent during source verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/config.js
          test ! -f public/config.js

      - name: Validate required Supabase secrets
        shell: bash
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_PROJECT_URL" ]; then
            echo "::error::Missing repository secret SUPABASE_PROJECT_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing repository secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Generate browser Supabase config
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LOGIN_DOMAIN: ${{ vars.LOGIN_DOMAIN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const projectUrl = String(process.env.SUPABASE_PROJECT_URL || '').trim()
          const publishableKey = String(process.env.SUPABASE_PUBLISHABLE_KEY || '').trim()
          const loginDomain = String(process.env.LOGIN_DOMAIN || 'users.example.com').trim()

          if (!/^https:\/\/.+\.supabase\.co\/?$/i.test(projectUrl)) {
            throw new Error('SUPABASE_PROJECT_URL must be a valid https://*.supabase.co URL')
          }
          if (!publishableKey) {
            throw new Error('SUPABASE_PUBLISHABLE_KEY is empty')
          }

          const config = {
            mode: 'supabase',
            projectUrl: projectUrl.replace(/\/$/, ''),
            publishableKey,
            loginDomain: loginDomain || 'users.example.com',
            fallbackRefreshSeconds: 180,
          }

          fs.writeFileSync(
            'public/config.js',
            `window.APP_CONFIG = ${JSON.stringify(config, null, 2)};\n`,
            'utf8',
          )
          console.log('Generated public/config.js with public browser configuration.')
          NODE

      - name: Typecheck application
        run: npm run typecheck

      - name: Build production site
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
