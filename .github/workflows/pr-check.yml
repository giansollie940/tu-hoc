name: PR check

# Runs the same checks a contributor runs locally on every pull request (any base branch,
# so stacked PRs are covered too). Builds only: nothing is deployed and no secrets are used.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Static tests
        run: npm test

      - name: Build (same flags as the Pages deploy)
        env:
          VITE_OWL_MASCOT_V2_ENABLED: 'true'
        run: npm run build:pages

      - name: Release verification
        run: npm run verify:release
